[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-guard"
version = "0.1.0"
description = "Heuristic scanner that detects prompt-injection attack patterns in user-supplied text"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Anusha Mukka" },
]
keywords = ["prompt-injection", "jailbreak", "llm-security", "scanner", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
urls = { Homepage = "https://anushamukka.com", Repository = "https://github.com/anushamukka9/prompt-injection-guard" }

[project.scripts]
pig = "prompt_injection_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
